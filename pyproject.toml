[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cde-transit-lakehouse"
version = "1.0.0"
description = "MBTA Real-Time & Batch Cloud Data Engineering Transit Lakehouse Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cloud Data Engineering Team", email = "admin@example.com" }
]
keywords = [
    "data-engineering",
    "lakehouse",
    "kafka",
    "pyspark",
    "airflow",
    "kubernetes",
    "aws-s3",
    "postgresql",
    "grafana"
]

dependencies = [
    # Event Streaming & Ingestion
    "kafka-python-ng>=2.2.3",
    "httpx>=0.27.0",

    # Distributed Compute & Data Lake
    "pyspark==3.5.3",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",

    # AWS Cloud Storage
    "boto3>=1.34.131",
    "botocore>=1.34.131",
    "awscli>=1.32.0",

    # Serving Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",

    # Orchestration & Workflow
    "apache-airflow>=2.10.3",

    # Utilities & Monitoring
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["streaming*", "transformation*", "orchestration*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
