# Airflow on Kubernetes configuration (Helm values for Airflow 2.10)
executor: "KubernetesExecutor"

# Production container image from GitHub Container Registry
images:
  airflow:
    repository: ghcr.io/dipk6545/cde-airflow
    tag: "latest"
    pullPolicy: IfNotPresent

# Webserver UI credentials for Airflow 2.10
webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    password: admin

# Pull secrets from Kubernetes Secret 'cde-aws-secrets'
extraEnvFrom: |
  - secretRef:
      name: cde-aws-secrets

# Connect directly to Prisma Cloud PostgreSQL (Production DB)
# Disabling in-cluster PostgreSQL prevents Docker Hub ErrImagePull & timeouts!
postgresql:
  enabled: false

data:
  metadataConnection:
    user: 1fb8021435a401e40d8d501be741ffe29f219f974d865312499f6c4ff95ea46d
    pass: sk_5vmfylBkkmgBuTxQOcXAV
    protocol: postgresql
    host: db.prisma.io
    port: 5432
    db: postgres
    sslmode: require
