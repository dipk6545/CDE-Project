# Airflow on Kubernetes configuration (Helm values for Airflow 2.10)
executor: "KubernetesExecutor"

# Production container image from GitHub Container Registry
images:
  airflow:
    repository: ghcr.io/dipk6545/cde-airflow
    tag: "latest"
    pullPolicy: IfNotPresent

# Webserver UI credentials for Airflow 2.10
webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    password: admin

# Pull secrets from Kubernetes Secret 'cde-aws-secrets'
extraEnvFrom: |
  - secretRef:
      name: cde-aws-secrets

# Connect directly to Neon Serverless PostgreSQL (Production DB)
# Disabling in-cluster PostgreSQL prevents Docker Hub ErrImagePull & timeouts!
postgresql:
  enabled: false

data:
  metadataConnection:
    user: neondb_owner
    pass: npg_M3Aapf0SXbYT
    protocol: postgresql
    host: ep-jolly-river-bia0d9s7-pooler.c-5.ap-southeast-1.aws.neon.tech
    port: 5432
    db: neondb
    sslmode: require
