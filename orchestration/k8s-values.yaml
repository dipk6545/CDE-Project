# Airflow on Kubernetes configuration (Helm values for Airflow 2.10)
executor: "KubernetesExecutor"

# Production container image from GitHub Container Registry
images:
  airflow:
    repository: ghcr.io/dipk6545/cde-airflow
    tag: "latest"
    pullPolicy: IfNotPresent

# Webserver UI credentials for Airflow 2.10
webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: Admin
    lastName: User
    password: admin

# Pull secrets from Kubernetes Secret 'cde-aws-secrets'
extraEnvFrom: |
  - secretRef:
      name: cde-aws-secrets

# Enable built-in PostgreSQL database for Airflow metadata inside the cluster
postgresql:
  enabled: true
