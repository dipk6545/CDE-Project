name: Build and Publish Airflow Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'orchestration/**'
      - 'transformation/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower-case image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/cde-airflow:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./orchestration/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
